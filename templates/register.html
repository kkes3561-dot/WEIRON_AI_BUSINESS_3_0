<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация · WEIRON</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><form class="login-card" method="post"><a class="brand" href="/">WEIRON<span> AI</span></a><div class="eyebrow">NEW WORKSPACE</div><h1>Создать CRM компании</h1><p>Данные каждой компании хранятся отдельно.</p><label>Название компании</label><input name="company" placeholder="Например, ООО Ромашка" required><label>Сфера деятельности</label><input name="industry" placeholder="Недвижимость, медицина, услуги…"><label>Email администратора</label><input type="email" name="email" placeholder="you@company.ru" required><label>Пароль (не менее 10 символов)</label><input type="password" name="password" minlength="10" required><button class="btn">Создать рабочее пространство</button>{% if error %}<div class="error">{{error}}</div>{% endif %}<a href="/login">Уже есть аккаунт? Войти</a></form></body></html>
